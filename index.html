<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="像素風肉鴿殭屍生存：怕死的穿越者躲在安全屋，派分身出去無限割草、抽功法、手搓機甲。">
<title>因為太怕死，只好派分身去滅世</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one fixed 16:9 stage (canvas 480x270 pixel art, DOM UI at 960x540) scaled to fit the viewport. Single dark look by choice. */
:root{
  --bg:#0b0812; --ink:#f4f4f4; --dim:#94b0c2; --panel:#1a1426; --panel2:#251d36;
  --line:#14101e; --cyan:#73eff7; --cyan2:#41a6f6; --gold:#ffcd4a; --pink:#ff77a8;
  --violet:#a46be0; --red:#ff4f6d; --green:#a7f070;
  --font:'DotGothic16','PingFang TC','Noto Sans TC','Microsoft JhengHei',monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#000}
#game{position:absolute;left:0;top:0;width:960px;height:540px;image-rendering:pixelated;image-rendering:crisp-edges}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#ui{position:absolute;inset:0;font-size:16px;line-height:1.5;user-select:none;-webkit-user-select:none}
#ui *{box-sizing:border-box}
.layer{position:absolute;inset:0}
.px{background:var(--panel);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--line),6px 6px 0 3px rgba(0,0,0,.55)}
.btn{font-family:var(--font);font-size:18px;color:var(--ink);background:var(--panel2);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--line),inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12);padding:8px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px}
.btn:hover,.btn:focus-visible{background:#3a2d55;outline:none;color:var(--cyan)}
.btn:active{transform:translate(2px,2px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{color:var(--dim);font-size:13px;margin-left:auto}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.title-logo{position:absolute;left:0;right:0;top:70px;text-align:center}
.title-logo .t1{font-size:26px;color:var(--dim);letter-spacing:6px}
.title-logo .t2{font-size:58px;line-height:1.1;color:var(--ink);text-shadow:4px 4px 0 var(--line),0 0 18px rgba(115,239,247,.45);letter-spacing:4px}
.title-logo .t2 b{color:var(--cyan);font-weight:400}
.title-logo .t3{margin-top:10px;font-size:15px;color:var(--pink);letter-spacing:3px}
.menu{position:absolute;display:flex;flex-direction:column;gap:12px}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* dialogue */
.dlg{position:absolute;left:24px;right:150px;top:34px;min-height:110px;padding:16px 22px;font-size:21px}
.dlg .who{position:absolute;top:-22px;left:16px;background:var(--panel2);border:3px solid var(--ink);padding:0 12px;font-size:17px;color:var(--gold)}
.dlg .who.sys{color:var(--cyan)}
.dlg .who.enemy{color:var(--red)}
.dlg .who.clone{color:var(--cyan2)}
.dlg .next{position:absolute;right:14px;bottom:6px;color:var(--cyan);font-size:15px}
.dlg.sysbox{background:rgba(10,30,48,.92);border-color:var(--cyan);color:var(--cyan)}
.skip{position:absolute;right:16px;top:40px;font-size:14px;color:var(--dim);background:rgba(0,0,0,.5);padding:4px 10px;border:2px solid var(--dim);cursor:pointer;font-family:var(--font)}
/* hub */
.hubside{position:absolute;right:18px;top:18px;bottom:18px;width:300px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.hubside .btn{padding:6px 14px;font-size:17px;flex-shrink:0}
.hubside h2{margin:0;font-weight:400;font-size:22px;color:var(--cyan)}
.hubside .pts{font-size:17px;color:var(--gold)}
.hubside .meta{font-size:13px;color:var(--dim);line-height:1.55}
.hubside .grow{flex:1;min-height:0}
.tag{display:inline-block;padding:0 6px;border:2px solid currentColor;font-size:13px;line-height:18px}
.toastbox{position:absolute;left:0;right:330px;top:78px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(10,30,48,.95);border:3px solid var(--cyan);color:var(--cyan);padding:8px 18px;font-size:18px;white-space:nowrap;pointer-events:none;animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* modal panels */
.modal{position:absolute;left:40px;right:40px;top:30px;bottom:30px;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-weight:400;font-size:26px;color:var(--cyan);display:flex;align-items:center;gap:14px}
.modal h2 .r{margin-left:auto;font-size:17px;color:var(--gold)}
.modal .body{flex:1;overflow:auto;min-height:0}
.modal .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{position:relative;background:var(--panel2);border:3px solid var(--dim);padding:8px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center}
.card:hover{border-color:var(--ink)}
.card.eq{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan2)}
.card.locked{cursor:default;opacity:.55}
.card .nm{font-size:17px}
.card .sm{font-size:12px;color:var(--dim);line-height:1.35}
.glyph{width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.25)}
.sch-武{background:#c8642a;color:#fff3d6}
.sch-魔{background:#5b3fb0;color:#e6dcff}
.sch-本{background:#1f6f6a;color:#c9fff6}
.rar{font-size:12px;padding:0 5px;border:2px solid currentColor}
.rar-N{color:#b9c4cf}.rar-R{color:#41a6f6}.rar-SR{color:#c06cf0}.rar-SSR{color:var(--gold)}
.badge-eq{position:absolute;top:4px;right:4px;font-size:11px;color:var(--line);background:var(--cyan);padding:0 4px}
.badge-new{position:absolute;top:4px;left:4px;font-size:12px;color:var(--line);background:var(--gold);padding:0 5px}
/* gacha */
.gres{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.gres .card{min-height:0;padding:6px;gap:2px}
.gcard{animation:flip .45s both}
.gcard.SSR{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(255,205,74,.7)}
.gcard.SR{box-shadow:0 0 0 3px #c06cf0}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
/* run HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.xpbar{position:absolute;left:0;right:0;top:0;height:16px;background:#14101e;border-bottom:3px solid var(--line)}
.xpfill{height:100%;background:linear-gradient(#73eff7,#41a6f6);width:0}
.xplv{position:absolute;right:8px;top:-2px;font-size:14px;color:var(--ink);text-shadow:2px 2px 0 var(--line)}
.hpwrap{position:absolute;left:12px;top:26px;display:flex;align-items:center;gap:8px;font-size:15px;text-shadow:2px 2px 0 var(--line)}
.hpbar{width:180px;height:14px;background:#14101e;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--line)}
.hpfill{height:100%;background:#a7f070;width:100%}
.hinfo{position:absolute;left:12px;top:50px;font-size:15px;color:var(--ink);text-shadow:2px 2px 0 var(--line);font-variant-numeric:tabular-nums}
.htimer{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:26px;text-shadow:3px 3px 0 var(--line);font-variant-numeric:tabular-nums}
.slots{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:flex-end}
.slot{width:46px;height:46px;background:rgba(20,16,30,.8);border:3px solid var(--dim);position:relative;display:flex;align-items:center;justify-content:center}
.slot img{width:36px;height:36px;image-rendering:pixelated}
.slot .lv{position:absolute;right:1px;bottom:-3px;font-size:12px;color:var(--gold);text-shadow:1px 1px 0 #000}
.slot.tr{border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.slot.skill{width:52px;height:52px;border-color:var(--cyan)}
.mechbar{position:absolute;right:12px;top:26px;font-size:14px;text-align:right;text-shadow:2px 2px 0 var(--line)}
.mechbar .cells{display:flex;gap:3px;justify-content:flex-end;margin-top:2px}
.mechbar .cell{width:14px;height:14px;border:2px solid var(--dim);background:#14101e}
.mechbar .cell.on{background:var(--gold);border-color:var(--gold)}
.mechbar.broken{color:#6d6680}
.pausebtn{position:absolute;right:12px;bottom:12px;pointer-events:auto;font-size:16px;padding:6px 12px}
.wname{position:absolute;left:12px;bottom:72px;font-size:13px;color:var(--dim);text-shadow:2px 2px 0 var(--line);line-height:1.4}
.wname b{color:var(--gold);font-weight:400}
/* level up */
.lvl{position:absolute;inset:0;background:rgba(6,4,12,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.lvl h3{margin:0;font-weight:400;font-size:30px;color:var(--cyan);text-shadow:3px 3px 0 var(--line)}
.lvl .opts{display:flex;gap:16px}
.opt{width:250px;min-height:210px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--panel2);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--line);font-family:var(--font);color:var(--ink);text-align:left;font-size:15px}
.opt:hover,.opt:focus-visible{border-color:var(--cyan);outline:none;transform:translateY(-4px)}
.opt .ot{font-size:20px}
.opt .od{color:var(--dim);font-size:14px;line-height:1.5}
.opt.mech{border-color:var(--gold);background:#3a2a10}
.opt.mech .ot{color:var(--gold)}
.opt .key{margin-top:auto;color:var(--dim);font-size:13px}
.center-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 30px;min-width:420px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.center-panel h2{margin:0;font-weight:400;font-size:28px;text-align:center}
.center-panel .stat{display:flex;justify-content:space-between;font-size:18px;font-variant-numeric:tabular-nums}
.big-banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:64px;color:var(--gold);text-shadow:5px 5px 0 var(--line),0 0 24px rgba(255,205,74,.8);pointer-events:none;animation:ban 2.2s both}
@keyframes ban{0%{transform:scale(2.5);opacity:0}15%{transform:scale(1);opacity:1}85%{opacity:1}100%{opacity:0}}
.prompt{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:26px;color:var(--gold);text-shadow:3px 3px 0 var(--line);pointer-events:auto;cursor:pointer}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
/* 手機直放時提示橫放 */
#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--ink);font-size:18px;text-align:center;padding:24px;line-height:1.6}
#rotate .phone{width:44px;height:76px;border:4px solid var(--cyan);border-radius:8px;box-shadow:0 0 16px rgba(115,239,247,.4);animation:rot 1.8s ease-in-out infinite}
#rotate small{color:var(--dim);font-size:14px}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){.blink,.gcard,.toast,.big-banner,#rotate .phone{animation:none}}
</style>
</head>
<body>
<div id="rotate"><div class="phone"></div><div>請將手機橫放<br><small>這款遊戲需要橫向畫面</small></div></div>
<div id="wrap"><div id="stage"><canvas id="game" width="480" height="270"></canvas><div id="scan"></div><div id="ui"></div></div></div>
<script src="js/data.js" charset="utf-8"></script>
<script src="js/gfx.js" charset="utf-8"></script>
<script src="js/game.js" charset="utf-8"></script>
</body>
</html>
